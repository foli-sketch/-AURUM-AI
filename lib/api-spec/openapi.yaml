openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Aura Terminal Pro - Gold Trading Signal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Gold trading signal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /trading/signal:
    get:
      operationId: getTradingSignal
      tags: [trading]
      summary: Get gold trading signal with full analysis
      parameters:
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: ["5m", "15m", "30m", "1h", "4h", "1d"]
            default: "1h"
      responses:
        "200":
          description: Trading signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingSignal"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trading/news:
    get:
      operationId: getMarketNews
      tags: [trading]
      summary: Get gold market news with sentiment
      responses:
        "200":
          description: News list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
  /trading/history:
    get:
      operationId: getSignalHistory
      tags: [trading]
      summary: Get recent signal history
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHistoryResponse"
  /trading/analysis:
    get:
      operationId: getAnalysis
      tags: [trading]
      summary: Get AI-generated market analysis
      parameters:
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: ["5m", "15m", "30m", "1h", "4h", "1d"]
            default: "1h"
      responses:
        "200":
          description: AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /trading/chat:
    post:
      operationId: sendChat
      tags: [trading]
      summary: Chat with Jarvis AI about gold market
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /trading/telegram:
    post:
      operationId: broadcastTelegram
      tags: [trading]
      summary: Broadcast signal to Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramRequest"
      responses:
        "200":
          description: Telegram result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Confirmation:
      type: object
      properties:
        text:
          type: string
        side:
          type: string
          enum: ["bull", "bear"]
      required: [text, side]
    CandlePattern:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: ["BULLISH", "BEARISH", "NEUTRAL"]
      required: [name, type]
    SMCLevel:
      type: object
      properties:
        high:
          type: number
        low:
          type: number
      required: [high, low]
    FVG:
      type: object
      properties:
        type:
          type: string
        top:
          type: number
        bottom:
          type: number
      required: [type, top, bottom]
    SMCAnalysis:
      type: object
      properties:
        bullish_obs:
          type: array
          items:
            $ref: "#/components/schemas/SMCLevel"
        bearish_obs:
          type: array
          items:
            $ref: "#/components/schemas/SMCLevel"
        fvgs:
          type: array
          items:
            $ref: "#/components/schemas/FVG"
        equal_highs:
          type: array
          items:
            type: number
        equal_lows:
          type: array
          items:
            type: number
      required: [bullish_obs, bearish_obs, fvgs, equal_highs, equal_lows]
    MTFEntry:
      type: object
      properties:
        bias:
          type: string
        rsi:
          type: number
          nullable: true
        macd_bull:
          type: boolean
          nullable: true
        ema_bull:
          type: boolean
          nullable: true
      required: [bias]
    Divergence:
      type: object
      properties:
        rsi:
          type: string
        macd:
          type: string
      required: [rsi, macd]
    HistorySignal:
      type: object
      properties:
        time:
          type: string
        timeframe:
          type: string
        signal:
          type: string
        price:
          type: number
        confidence:
          type: number
        pattern:
          type: string
      required: [time, timeframe, signal, price, confidence, pattern]
    TradingSignal:
      type: object
      properties:
        price:
          type: number
        signal:
          type: string
          enum: ["BUY", "SELL", "HOLD"]
        confidence:
          type: number
        score:
          type: number
        bear_score:
          type: number
        confirmations:
          type: array
          items:
            $ref: "#/components/schemas/Confirmation"
        session:
          type: string
        trade_allowed:
          type: boolean
        mtf_bias:
          type: string
        mtf_data:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MTFEntry"
        indicators:
          type: object
          additionalProperties:
            type: number
            nullable: true
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/CandlePattern"
        divergence:
          $ref: "#/components/schemas/Divergence"
        smc:
          $ref: "#/components/schemas/SMCAnalysis"
        support:
          type: array
          items:
            type: number
        resistance:
          type: array
          items:
            type: number
        sl:
          type: number
          nullable: true
        tp1:
          type: number
          nullable: true
        tp2:
          type: number
          nullable: true
        tp3:
          type: number
          nullable: true
        rr:
          type: number
          nullable: true
        timeframe:
          type: string
        recent_signals:
          type: array
          items:
            $ref: "#/components/schemas/HistorySignal"
      required:
        - price
        - signal
        - confidence
        - score
        - bear_score
        - confirmations
        - session
        - trade_allowed
        - mtf_bias
        - mtf_data
        - indicators
        - patterns
        - divergence
        - smc
        - support
        - resistance
        - timeframe
        - recent_signals
    NewsItem:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        published:
          type: string
        url:
          type: string
        sentiment:
          type: string
          enum: ["BULLISH", "BEARISH", "NEUTRAL"]
        source:
          type: string
      required: [title, summary, published, url, sentiment, source]
    NewsResponse:
      type: object
      properties:
        news:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
      required: [news]
    SignalHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistorySignal"
      required: [history]
    AnalysisResponse:
      type: object
      properties:
        analysis:
          type: string
      required: [analysis]
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: ["user", "assistant"]
        content:
          type: string
      required: [role, content]
    MarketSnapshot:
      type: object
      properties:
        price:
          type: number
          nullable: true
        signal:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
        session:
          type: string
          nullable: true
        mtf_bias:
          type: string
          nullable: true
        rsi:
          type: number
          nullable: true
        macd:
          type: number
          nullable: true
        adx:
          type: number
          nullable: true
        atr:
          type: number
          nullable: true
        ema8:
          type: number
          nullable: true
        ema21:
          type: number
          nullable: true
        patterns:
          type: array
          nullable: true
          items: {}
        divergence:
          type: object
          nullable: true
          additionalProperties: {}
        support:
          type: array
          nullable: true
          items:
            type: number
        resistance:
          type: array
          nullable: true
          items:
            type: number
        confirmations:
          type: array
          nullable: true
          items: {}
    ChatRequest:
      type: object
      properties:
        message:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        market_snapshot:
          $ref: "#/components/schemas/MarketSnapshot"
      required: [message]
    ChatResponse:
      type: object
      properties:
        response:
          type: string
      required: [response]
    TelegramRequest:
      type: object
      properties:
        data:
          type: object
          additionalProperties: {}
      required: [data]
    TelegramResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
          nullable: true
      required: [success]
